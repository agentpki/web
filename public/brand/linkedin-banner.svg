<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <!-- Background: matches site's bg-mesh aesthetic. Glow shifted LEFT
         (toward where the profile picture will sit) so the pic has a
         nice violet halo behind it. Right side stays cleaner for the
         wordmark + tagline. -->
    <radialGradient id="bgGlow" cx="0.18" cy="0.5" r="0.55">
      <stop offset="0%"  stop-color="#1a1230"/>
      <stop offset="55%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#08080b"/>
    </radialGradient>

    <!-- Dot grid pattern (subtle, matches site's bg-grid) -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="rgba(167,139,250,0.13)"/>
    </pattern>

    <!-- Violet gradient for wordmark accent on the period -->
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: dark base with violet glow on the left (behind profile pic) -->
  <rect width="1128" height="191" fill="url(#bgGlow)"/>

  <!-- Layer 2: subtle dot grid overlay -->
  <rect width="1128" height="191" fill="url(#dotGrid)"/>

  <!-- Layer 3: subtle decorative rings on the far right edge -->
  <circle cx="1110" cy="95" r="100" fill="none" stroke="rgba(167,139,250,0.07)" stroke-width="1"/>
  <circle cx="1110" cy="95" r="65"  fill="none" stroke="rgba(167,139,250,0.05)" stroke-width="1"/>

  <!-- ─────────── CONTENT STACK on the right side ───────────
       Profile picture safe zone is roughly x=0 to x=240 (lower half)
       and x=0 to x=180 (full height). We start content at x=320 to
       keep everything visible regardless of how LinkedIn positions
       the profile pic on different screen sizes. -->

  <!-- Wordmark -->
  <text x="560" y="62"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="48"
        font-weight="600"
        letter-spacing="-1"
        fill="#e7e7ea">
    AgentPKI
  </text>

  <!-- Tagline — wrapped to 2 lines so it fits comfortably right of the wordmark column -->
  <text x="560" y="100"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#9c9cab">
    A passport-based identity system for AI agents
  </text>
  <text x="560" y="124"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#9c9cab">
    on the public internet.
  </text>

  <!-- Status pill — under the tagline, left-aligned with wordmark -->
  <g transform="translate(560, 142)">
    <rect width="180" height="32" rx="16" fill="rgba(15,15,18,0.7)" stroke="rgba(167,139,250,0.35)" stroke-width="1"/>
    <!-- Pulse dot -->
    <circle cx="18" cy="16" r="4" fill="#4ade80"/>
    <circle cx="18" cy="16" r="7" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
    <text x="32" y="21"
          font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace"
          font-size="11"
          font-weight="500"
          letter-spacing="0.5"
          fill="#c4b5fd">
      live · v0.1 alpha
    </text>
  </g>
</svg>
